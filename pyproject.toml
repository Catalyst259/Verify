[project]
name = "verify"
version = "0.1.0"
description = "验一下：从种草材料提取主张并按类别核验的旅行信息核验服务"
requires-python = ">=3.12"
dependencies = [
    "browser-use==0.13.10",
    "playwright>=1.50,<2",
    "fastapi==0.142.2",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart==0.0.32",
    "pillow==12.3.0",
    "langgraph==1.1.2",
    "openai>=2.26,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
