<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>验一下 · 旅行信息核验</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>验一下</h1>
    <p>放入你看到的种草内容，提取影响旅行决策的说法并查看核验结果。</p>
    <form id="form">
      <fieldset id="fields">
        <label for="place">地点</label>
        <input id="place" name="target_place" maxlength="100" placeholder="例如：上海迪士尼乐园" aria-describedby="place-hint" required>
        <small id="place-hint">地点仅用于限定核验范围。请同时提供文字、图片或链接中的至少一种材料。</small>

        <label for="images">图片</label>
        <div id="dropzone">
          <span>将图片拖到这里，或选择图片</span>
          <input id="images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple>
          <small>支持多张 PNG、JPEG、WebP、GIF，每张不超过 10 MB</small>
        </div>
        <ul id="uploads" aria-live="polite"></ul>

        <label for="description">描述</label>
        <textarea id="description" rows="4" placeholder="粘贴你想评估的种草描述"></textarea>

        <label for="links">链接</label>
        <textarea id="links" rows="3" placeholder="每行一个完整链接，支持多个"></textarea>
        <button id="submit" type="submit">开始评估</button>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden>
      <h2>核验结果</h2>
      <p>以下展示提取的主张和本次核验结果；流程完成不代表所有主张都真实。</p>
      <pre id="claims"></pre>
    </section>
  </main>
</body>
</html>
